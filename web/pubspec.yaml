    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7
  dio: ^5.7.0
  web_socket_channel: ^3.0.0
  flame: ^1.18.0
  emoji_picker_flutter: ^4.4.0
  animated_emoji: ^3.2.1
  livekit_client: ^2.3.0
  record: ^7.1.0

